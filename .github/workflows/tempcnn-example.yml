name: Reproduce TempCNN example (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KERAS_BACKEND: torch
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies (CPU)
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'keras>=3.10,<4' 'numpy>=2,<3'
      - name: Historical normalization order
        run: python modern_reproduction/example.py --protocol pre-split --output outputs/pre-split
      - name: Train-only normalization
        run: python modern_reproduction/example.py --protocol train-only --output outputs/train-only
      - name: Upload results (no model checkpoints)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tempcnn-example-results
          path: |
            outputs/*/result.json
            outputs/*/predictions.csv
            outputs/*/confusion_matrix.csv
          retention-days: 14
